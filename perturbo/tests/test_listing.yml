#
# The Perturbo tests are organized by corresponding epr HDF5 files: 
# epr1, epr2, etc.
# Each epr file has a set of tests associated with it. 
# Each test has a correspoding folder, the foldername is made in the following way:
# epr<n>-<testname>, where n is the index of the epr file 
# and <testname> is a name of a given test.
#
epr1:
   prefix: gaas
   filename: gaas_epr.h5
   SOC: True
   polar: True
   description: "GaAs with SOC"
   pseudopotential: Ga and As from Pseudo-Dojo
   tags:
      - SOC
      - polar
      - norm-conserving
      - lda
      - fully-relativistic
   tests:
      bands:
          - high-sym-k
          - bands
          - cpu
      spins:
          - high-sym-k
          - spins
          - bands
          - cpu
      phdisp:
          - high-sym-q
          - phdisp
          - cpu
      ephmat:
          - ephmat
          - random-k
          - random-q
          - uniform
          - cpu
      ephmat-spin:
          - ephmat-spin
          - random-k
          - random-q
          - uniform
          - cpu
      setup:
          - setup
          - HDF5-output
          - cpu
      setup-find-efermi:
          - setup
          - HDF5-output
          - find_efermi
          - cpu
      imsigma:
          - imsigma
          - random-q
          - cpu
      imsigma-dense:
          - imsigma-dense
          - cpu
      imsigma-spin:
          - imsigma-spin
          - random-q
          - cpu
      meanfp:
          - meanfp
          - load-imsigma
          - random-q
          - cpu
      meanfp-dense:
          - meanfp-dense
          - cpu
      spin-lifetime:
          - spin-lifetime
          - load-imsigma-flip
          - cpu
      trans-rta:
          - trans
          - trans-rta
          - compute-eph
          - HDF5-output
          - HDF5-load
          - cpu
      trans-rta-gpu:
