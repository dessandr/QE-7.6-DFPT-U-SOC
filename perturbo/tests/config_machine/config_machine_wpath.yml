PERT_SCRATCH: tmp
source_link: https://caltech.box.com/shared/static/3xj9sknmt75aho66eyad1wwa6dat4s0d.zip 
prel_coms:
    - export QE_PATH="<your path to Quantum Espresso folder>"
comp_info:
    qe2pert:
        prel_coms:
            - export OMP_NUM_THREADS=8
        exec: srun -n 8 "$QE_PATH"/perturbo/bin/qe2pert.x -npools 8
    perturbo:
        prel_coms:
            - export OMP_NUM_THREADS=8
        exec: srun -n 8 "$QE_PATH"/perturbo/bin/perturbo.x -npools 8
